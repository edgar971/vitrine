name: Bug report
description: vitrine did something the spec says it should not.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste a token, `VITRINE_SECRET`, or a `/s/…` or `/u/…` URL: they are credentials.
        Security problems go to a private advisory, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The tool call or HTTP request, and the configuration that matters.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`mcp-vitrine --version`, or the image tag or digest."
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options: [Claude Code, Hermes, another MCP client, HTTP API only]
