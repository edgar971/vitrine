name: ci

on:
  # Branches only: a `v*` tag runs these same jobs once, through release.yml.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Nothing in the run may reach out for a newer resolution: the lock is the input.
      UV_FROZEN: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Pinned so a run is reproducible; bump deliberately, with the lock.
          # astral-sh publishes no floating `v10` tag: the full version is required.
          version: "0.13.1"
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install just
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0

      - name: Install the environment
        run: uv sync --locked

      # Every gate is a justfile recipe, so CI and a local `just check` cannot drift.
      - name: Lock check
        run: just lock-check

      - name: Ruff
        run: just lint

      - name: mypy
        run: just types

      - name: import-linter
        run: just layers

      - name: pytest with coverage
        run: just test

      - name: pip-audit
        run: just audit

  # The sandbox invariant (no allow-same-origin) is only proven in a real browser.
  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_FROZEN: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install just
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0

      - name: Install the environment
        run: uv sync --locked

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Sandbox specs in Chromium
        run: just test-browser

  examples:
    name: examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0

      # kubeconform (from its image), docker compose config and caddy adapt.
      - name: Validate the examples
        run: just examples

  hermes-plugin:
    name: hermes plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hermes's own admission check: manifest, an isolated register() probe, collisions with
      # built-in tools and the install-time security scan (docs/research.md § 5). PyPI's
      # hermes-agent predates the command, so the action builds it from source at the pinned ref.
      - name: hermes plugins validate
        uses: NousResearch/hermes-agent/.github/actions/plugin-validate@b51e8b850494e0a95a4b410c3d9b9a26df9ae261
        with:
          path: integrations/hermes/drop
          # The Hermes the plugin is admitted against; bump it with the action's pin.
          hermes-ref: b51e8b850494e0a95a4b410c3d9b9a26df9ae261

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Both architectures must build; nothing is pushed until the release workflow exists.
      - name: Build amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The roadmap's check: the image runs with --read-only and passes /healthz.
      - name: Smoke test
        run: just image-test drop:ci
