name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Nothing in the run may reach out for a newer resolution: the lock is the input.
      UV_FROZEN: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          # Pinned so a run is reproducible; bump deliberately, with the lock.
          # astral-sh publishes no floating `v10` tag: the full version is required.
          version: "0.13.1"
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install just
        uses: taiki-e/install-action@v2.87.28
        with:
          tool: just@1.58.0

      - name: Install the environment
        run: uv sync --locked

      # Every gate is a justfile recipe, so CI and a local `just check` cannot drift.
      - name: Lock check
        run: just lock-check

      - name: Ruff
        run: just lint

      - name: mypy
        run: just types

      - name: import-linter
        run: just layers

      - name: pytest with coverage
        run: just test

      - name: pip-audit
        run: just audit

  examples:
    name: examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@v2.87.28
        with:
          tool: just@1.58.0

      # kubeconform (from its image), docker compose config and caddy adapt.
      - name: Validate the examples
        run: just examples

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@v2.87.28
        with:
          tool: just@1.58.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Both architectures must build; nothing is pushed until the release workflow exists.
      - name: Build amd64 and arm64
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The roadmap's check: the image runs with --read-only and passes /healthz.
      - name: Smoke test
        run: just image-test drop:ci
