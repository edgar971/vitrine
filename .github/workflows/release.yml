name: release

# A `v*` tag publishes that version (docs/design.md § 10): the wheel and sdist to PyPI by trusted
# publishing, the multi-arch image to GHCR signed with cosign and carrying an SBOM, and a GitHub
# release whose notes are the version's CHANGELOG.md section. Nothing is published unless every
# CI gate passes on the tagged commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/edgar971/drop

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The tag, the package and the changelog must agree before anything leaves the repository.
      - name: Tag, pyproject.toml and CHANGELOG.md agree
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          project="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
          if [ "$version" != "$project" ]; then
            echo "::error::tag $TAG does not match the pyproject.toml version $project"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [$version] section"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  pypi:
    name: pypi
    needs: [ci, version]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PyPI trusts this workflow, in this environment, to publish mcp-drop: no token is stored.
    environment:
      name: pypi
      url: https://pypi.org/project/mcp-drop/${{ needs.version.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.15"

      - name: Build the wheel and the sdist
        run: uv build

      - name: Publish by trusted publishing
        run: uv publish --trusted-publishing always

  image:
    name: image
    needs: [ci, version]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # cosign signs keylessly with the workflow's OIDC identity.
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the exact version is tagged: deployments pin a version or a digest, never `latest`.
      - name: Build and push amd64 and arm64, with an SBOM and provenance
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      # Signing the digest, not the tag, so the signature covers exactly what was pushed.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  github:
    name: github release
    needs: [version, pypi, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
