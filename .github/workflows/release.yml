name: release

# A `v*` tag publishes that version (docs/design.md § 10): the multi-arch image to GHCR, smoke-
# tested and signed with cosign, with an SBOM; then the wheel and sdist by trusted publishing; then
# a GitHub release. Nothing is published unless every CI gate passes on the tagged commit.
#
# - `vX.Y.Z` is a release: PyPI, and notes from its CHANGELOG.md section.
# - `vX.Y.ZrcN` (or aN, bN) is a pre-release to rehearse one: TestPyPI, and notes rendered from
#   the commits since the last release; the GitHub release is marked as a pre-release.
#
# The image goes first: a PyPI version can never be uploaded again, so it is spent only once the
# image is out and verified.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/edgar971/drop

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag, the package and the changelog must agree before anything leaves the repository.
      - name: Tag, pyproject.toml and CHANGELOG.md agree
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # PEP 440, as scripts/release.py accepts it: `-rc.1` would publish as `rc1` and the
          # tag, the package and the image would disagree.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::tag $TAG is not vX.Y.Z or vX.Y.Z(a|b|rc)N"
            exit 1
          fi
          version="${TAG#v}"
          project="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
          if [ "$version" != "$project" ]; then
            echo "::error::tag $TAG does not match the pyproject.toml version $project"
            exit 1
          fi
          prerelease=false
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease=true
          elif ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [$version] section"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  image:
    name: image
    needs: [ci, version]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # cosign signs keylessly with the workflow's OIDC identity.
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the exact version is tagged: deployments pin a version or a digest, never `latest`.
      - name: Build and push amd64 and arm64, with an SBOM and provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
          sbom: true
          provenance: mode=max
          # No build cache: any branch's CI run can write it, and the signed image must be
          # built only from what this tag names.
          no-cache: true

      # What was pushed, not a local rebuild: the runner pulls its own (amd64) image by digest.
      - name: Smoke-test the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker/smoke.sh "$IMAGE@$DIGEST"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signing the digest, not the tag, so the signature covers exactly what was pushed.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  pypi:
    name: pypi
    needs: [ci, version, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PyPI (or TestPyPI, for a pre-release) trusts this workflow, in this environment, to publish
    # mcp-drop: no token is stored.
    environment:
      name: ${{ needs.version.outputs.prerelease == 'true' && 'testpypi' || 'pypi' }}
      url: ${{ needs.version.outputs.prerelease == 'true' && 'https://test.pypi.org' || 'https://pypi.org' }}/project/mcp-drop/${{ needs.version.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.15"

      - name: Build the wheel and the sdist
        run: uv build

      # The metadata PyPI renders and validates; a rejection here costs nothing.
      - name: Check the distributions
        run: uvx twine@6.2.0 check --strict dist/*

      - name: Publish by trusted publishing
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/
          else
            uv publish --trusted-publishing always
          fi


  github:
    name: github release
    needs: [version, pypi, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git-cliff walks back to the previous release tag.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"

      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            # cliff.toml counts only final tags, so this is everything since the last release.
            uvx git-cliff@2.14.2 --unreleased --strip all | tail -n +2 > notes.md
          else
            awk -v heading="## [$VERSION]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > notes.md
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}"
