name: drop
version: 0.1.0
description: >-
  Publish local files and folders to the drop artifact service and manage share links.
  Pairs with the drop MCP server (mcp_servers.drop).
author: mcp-drop contributors
kind: standalone
platforms:
  - linux
  - macos
requires_env:
  - DROP_URL
  - DROP_TOKEN
provides_tools:
  - artifact_publish_files
