# drop behind Caddy, which gets and renews the TLS certificate.
#
#   1. Point DNS for your domain at this host.
#   2. Write .env beside this file (never commit it):
#        DROP_DOMAIN=drop.example.com
#        DROP_SECRET=<mcp-drop secret new>
#        DROP_TOKENS=<entries from mcp-drop token new>
#   3. docker compose up -d
#
# Only Caddy publishes ports. drop trusts X-Forwarded-For from the `edge` subnet alone, which
# only Caddy and drop are on.

name: drop

services:
  drop:
    image: ghcr.io/edgar971/drop:0.1.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DROP_SECRET: ${DROP_SECRET:?set DROP_SECRET in .env}
      DROP_TOKENS: ${DROP_TOKENS:?set DROP_TOKENS in .env}
      DROP_PUBLIC_BASE_URL: https://${DROP_DOMAIN:?set DROP_DOMAIN in .env}
      DROP_FORWARDED_ALLOW_IPS: 172.30.80.0/24
      DROP_LOG_FORMAT: json
    volumes:
      - drop-data:/data
    networks: [edge]

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DROP_DOMAIN: ${DROP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [drop]
    networks: [edge]

volumes:
  drop-data:
  caddy-data:
  caddy-config:

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.80.0/24
