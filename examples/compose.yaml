# vitrine behind Caddy, which gets and renews the TLS certificate.
#
#   1. Point DNS for your domain at this host.
#   2. Write .env beside this file (never commit it):
#        VITRINE_DOMAIN=vitrine.example.com
#        VITRINE_SECRET=<mcp-vitrine secret new>
#        VITRINE_TOKENS=<entries from mcp-vitrine token new>
#   3. docker compose up -d
#
# Only Caddy publishes ports. vitrine trusts X-Forwarded-For from the `edge` subnet alone, which
# only Caddy and vitrine are on.

name: vitrine

services:
  vitrine:
    image: ghcr.io/edgar971/vitrine:0.2.0rc1
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      VITRINE_SECRET: ${VITRINE_SECRET:?set VITRINE_SECRET in .env}
      VITRINE_TOKENS: ${VITRINE_TOKENS:?set VITRINE_TOKENS in .env}
      VITRINE_PUBLIC_BASE_URL: https://${VITRINE_DOMAIN:?set VITRINE_DOMAIN in .env}
      VITRINE_FORWARDED_ALLOW_IPS: 172.30.80.0/24
      VITRINE_LOG_FORMAT: json
    volumes:
      - vitrine-data:/data
    networks: [edge]

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      VITRINE_DOMAIN: ${VITRINE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [vitrine]
    networks: [edge]

volumes:
  vitrine-data:
  caddy-data:
  caddy-config:

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.80.0/24
