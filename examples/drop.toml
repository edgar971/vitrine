# drop.toml: safe to commit. Secrets never go here; they come from DROP_SECRET and DROP_TOKENS
# (`mcp-drop secret new`, `mcp-drop token new <name>`), and a file that sets one is refused.
# Every key, with its default: docs/configuration.md.
# Run: mcp-drop config check --config drop.toml && mcp-drop serve --config drop.toml

[drop]
data_dir        = "/var/lib/drop"
public_base_url = "https://drop.example.com"
host            = "127.0.0.1"          # behind a reverse proxy on the same host
port            = 8080
public_mode     = "confirm"            # a human approves every publish (spec § 6)
renderers       = ["md", "csv", "tsv", "json"]
quota           = "20GB"
retain_versions = 10
link_ttl        = "3d"
link_ttl_max    = "30d"
metrics_port    = 9090                 # needs mcp-drop[metrics]; 0 turns it off
log_format      = "json"
