apiVersion: apps/v1
kind: Deployment
metadata:
  name: drop
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two pods must never write one data_dir.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: drop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drop
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: drop
          image: ghcr.io/edgar971/drop:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/etc/drop/drop.toml"]
          envFrom:
            - secretRef:
                name: drop-secrets
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          # Every route checks Host (spec § 7.4), the probes included.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: drop.example.com
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: drop.example.com
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: drop.example.com
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/drop
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: drop-data
        - name: config
          configMap:
            name: drop
