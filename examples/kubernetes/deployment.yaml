apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitrine
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two pods must never write one data_dir.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vitrine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vitrine
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vitrine
          image: ghcr.io/edgar971/vitrine:0.1.0rc1
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/etc/vitrine/vitrine.toml"]
          envFrom:
            - secretRef:
                name: vitrine-secrets
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          # Every route checks Host (spec § 7.4), the probes included.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: vitrine.example.com
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: vitrine.example.com
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: vitrine.example.com
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/vitrine
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vitrine-data
        - name: config
          configMap:
            name: vitrine
