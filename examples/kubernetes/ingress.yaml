# TLS ends at the ingress. Use a hostname that carries no other application's cookies.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vitrine
spec:
  ingressClassName: nginx
  tls:
    - hosts: [vitrine.example.com]
      secretName: vitrine-tls
  rules:
    - host: vitrine.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vitrine
                port:
                  name: http
