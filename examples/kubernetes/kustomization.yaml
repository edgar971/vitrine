# vitrine on Kubernetes: one replica on an RWO volume, Pod Security `restricted`, no egress.
#
#   kubectl create namespace vitrine   # or apply namespace.yaml first
#   kubectl -n vitrine create secret generic vitrine-secrets \
#     --from-literal=VITRINE_SECRET="$(mcp-vitrine secret new)" \
#     --from-literal=VITRINE_TOKENS="<entries from mcp-vitrine token new>"
#   kubectl apply -k .
#
# Replace vitrine.example.com (configmap, deployment probes, ingress), the ingress class and the
# namespace labels the network policy matches, to fit your cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vitrine
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
labels:
  - pairs:
      app.kubernetes.io/name: vitrine
    includeSelectors: true
