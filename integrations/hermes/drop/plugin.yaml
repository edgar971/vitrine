name: drop
version: 0.1.0
description: >-
  Publish local files and folders to a drop server as private links, and list what was shared.
  Pairs with the drop MCP server (mcp_servers.drop), which owns links, visibility and history.
author: Edgar Pino
kind: standalone
platforms:
  - linux
  - macos
requires_env:
  - DROP_URL
  - DROP_TOKEN
provides_tools:
  - artifact_publish_files
