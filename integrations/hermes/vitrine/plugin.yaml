name: vitrine
version: 0.2.0
description: >-
  Publish local files and folders to a vitrine server as private links, and list what was shared.
  Pairs with the vitrine MCP server (its own `mcp_servers` key, never one named `vitrine`), which
  owns links, visibility and history.
author: Edgar Pino
kind: standalone
platforms:
  - linux
  - macos
requires_env:
  - VITRINE_URL
  - VITRINE_TOKEN
provides_tools:
  - artifact_publish_files
