name: vitrine
version: 0.1.0
description: >-
  Publish local files and folders to a vitrine server as private links, and list what was shared.
  Pairs with the vitrine MCP server (mcp_servers.vitrine_mcp), which owns links, visibility and history.
author: Edgar Pino
kind: standalone
platforms:
  - linux
  - macos
requires_env:
  - VITRINE_URL
  - VITRINE_TOKEN
provides_tools:
  - artifact_publish_files
