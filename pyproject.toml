[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "mcp-vitrine"
version = "0.2.0"
description = "Self-hosted MCP server that turns agent output into private (signed, expiring, revocable) or public links."
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Edgar Pino" }]
keywords = ["mcp", "artifacts", "sharing", "self-hosted", "fastmcp", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "fastmcp>=4.1,<4.2",
  "httpx2>=2.13",
  "markdown-it-py>=4.2",
  "mdit-py-plugins>=0.5",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "python-multipart>=0.0.20",
  "starlette>=1.8,<2",
  "uvicorn>=0.54",
]

# The Prometheus listener on metrics_port (spec § 11.2) is the only optional feature.
[project.optional-dependencies]
metrics = ["prometheus-client>=0.26"]

[project.scripts]
mcp-vitrine = "mcp_vitrine.cli:main"
vitrine = "mcp_vitrine.client.cli:main"

[project.urls]
Homepage = "https://github.com/edgar971/vitrine"
Documentation = "https://github.com/edgar971/vitrine/tree/main/docs"
Changelog = "https://github.com/edgar971/vitrine/blob/main/CHANGELOG.md"
Issues = "https://github.com/edgar971/vitrine/issues"
Security = "https://github.com/edgar971/vitrine/blob/main/SECURITY.md"

# Same gates as CI (docs/design.md § 10). The browser group is only needed for the
# `browser` marker, which the default run deselects.
[dependency-groups]
dev = [
  "import-linter>=2.15",
  "mypy>=2.4",
  "playwright>=1.64",
  "pre-commit>=4.7",
  "prometheus-client>=0.26",
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7.1",
  "pytest-playwright>=0.10",
  "ruff>=0.17",
]

# A named index outranks the default one, so a machine-wide UV_INDEX_URL or UV_DEFAULT_INDEX
# (a private mirror) cannot re-resolve uv.lock away from PyPI, which CI and contributors use.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["src", "tests", "integrations/hermes"]
# The docs are the spec, not code: their examples are hand-wrapped.
extend-exclude = ["**/*.md"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "RUF",   # ruff-specific
  "ANN",   # flake8-annotations
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "PTH",   # flake8-use-pathlib
  "RET",   # flake8-return
  "TID",   # flake8-tidy-imports
  "S",     # flake8-bandit
  "D",     # pydocstyle
  "PL",    # pylint
  "PT",    # flake8-pytest-style
  "N",     # pep8-naming
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# FastMCP's injection markers are evaluated once, as markers; that is what B008 guards against.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastmcp.dependencies.CurrentAccessToken",
  "fastmcp.dependencies.CurrentContext",
  "fastmcp.dependencies.Depends",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Specs are named for the behaviour they describe; the name is the documentation. Tests also
# carry fake secrets and non-loopback hosts on purpose.
"tests/**" = ["D101", "D102", "D103", "D106", "S101", "S104", "S105", "PLR2004"]
# The domain errors are named as docs/design.md § 3 names them: NotFound, Expired, Conflict, …
"src/mcp_vitrine/domain/errors.py" = ["N818"]
# A tool's parameters are its schema (spec § 5.1): one per documented argument, plus injections.
"src/mcp_vitrine/mcp/tools.py" = ["PLR0913", "PLR0917"]
# Hermes loads a plugin as a package under a name of its own choosing, so it imports itself
# relatively.
"integrations/hermes/**" = ["TID252"]
# The release script runs git and uvx from PATH, like the justfile that calls it, with fixed args.
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["src", "tests", "integrations/hermes/vitrine", "scripts"]
mypy_path = "integrations/hermes"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
# The Hermes plugin is not part of the package; the specs import it as Hermes does, as `vitrine`.
pythonpath = ["integrations/hermes", "scripts"]
python_files = ["*_spec.py"]
python_classes = ["Describe*", "When*"]
python_functions = ["it_*"]
asyncio_mode = "auto"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "-m",
  "not browser",
]
markers = ["browser: drives a real Chromium (Playwright); run with `-m browser`"]

[tool.coverage.run]
branch = true
source = ["mcp_vitrine", "vitrine"]

[tool.coverage.report]
fail_under = 90
show_missing = true

# Dependencies point one way (docs/design.md § 3): mcp/web -> services -> storage -> domain.
# `|` marks modules that must not import each other; domain sits below storage, which uses it.
[tool.importlinter]
root_package = "mcp_vitrine"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = [
  "mcp_vitrine.mcp | mcp_vitrine.web",
  "mcp_vitrine.services",
  "mcp_vitrine.storage",
  "mcp_vitrine.domain",
]

[[tool.importlinter.contracts]]
name = "core is framework-free"
type = "forbidden"
source_modules = ["mcp_vitrine.domain", "mcp_vitrine.storage", "mcp_vitrine.services"]
forbidden_modules = ["fastmcp", "starlette", "uvicorn"]

[[tool.importlinter.contracts]]
name = "the client speaks HTTP only"
type = "forbidden"
source_modules = ["mcp_vitrine.client"]
forbidden_modules = [
  "mcp_vitrine.app",
  "mcp_vitrine.cli",
  "mcp_vitrine.mcp",
  "mcp_vitrine.services",
  "mcp_vitrine.storage",
  "mcp_vitrine.web",
]
